[project]
name = "scopeguard-mcp-chatbot"
version = "0.1.0"
description = "LangChain create_agent chatbot that uses the ScopeGuard MCP server (Streamable HTTP) as its tools"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.5",
    "langchain-groq>=1.2",
    # chunking with overlap for tool results larger than one chunk (context_fit.py)
    "langchain-text-splitters>=0.3",
    "tenacity>=8.2",
    # 0.3.x needs the MCP 1.x SDK; the scanner itself runs MCP 2.x, so this folder has its own venv.
    "langchain-mcp-adapters>=0.3.2",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

# Its own ruff root, so `ruff check` from the repo root also sees scopeguard_common, guardrails and
# chatbot as this folder's first-party modules (same import order as a run inside this folder).
[tool.ruff]
src = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
